name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar módulo canónico y fixtures
        run: |
          cp analizador.py docs/analizador.py
          cp RobertoFlores-Tarea03.pdf docs/RobertoFlores-Tarea03.pdf
          mkdir -p docs/ejemplos
          cp pruebas/bien_formado.log pruebas/con_errores.log pruebas/ejemplo_enunciado.log docs/ejemplos/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
